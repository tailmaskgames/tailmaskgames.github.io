<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>法師練級路線 · 魔獸永恆部落</title>
<meta name="description" content="魔獸永恆部落法師 1–60 練級路線：每個等級該在哪裡解任務、哪些任務必做（裝備）、哪些值得做（錢），以及每個副本的建議等級。">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#0d0907; --bg2:#15100c; --panel:#1b1410; --panel2:#231a14; --line:#3a2a1f; --line2:#56402e;
  --ink:#eee3cf; --ink2:#c9b99e; --muted:#8f7d66;
  --gold:#e0b25b; --gold2:#f4d48f; --ember:#e2552b; --blood:#a8231a; --blood2:#d43b2a;
  --q0:#9d9d9d; --q1:#f2f2f2; --q2:#1eff00; --q3:#3c95ff; --q4:#b465ff; --q5:#ff8000;
  --green:#4fd36b; --cls:#69ccf0; --new:#ffb627;
  --lv-lo:#5fbf6a; --lv-mid:#e0b25b; --lv-hi:#e2552b;
  --shadow:0 18px 40px -18px rgba(0,0,0,.8);
  --serif:"Noto Serif TC","Songti TC",serif; --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --disp:"Cinzel","Noto Serif TC",serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#efe5d2; --bg2:#e6d9c1; --panel:#fbf5ea; --panel2:#f3e9d7; --line:#d8c7a8; --line2:#c1a97f;
  --ink:#2a1c12; --ink2:#4d3a2a; --muted:#806a52;
  --gold:#9a6a12; --gold2:#7a520a; --ember:#c0431d; --blood:#9a1f17; --blood2:#b5281c;
  --q0:#777; --q1:#3a3a3a; --q2:#178a00; --q3:#0b5fd1; --q4:#7d2fc9; --q5:#c45f00;
  --green:#1d8a3a; --new:#b36b00; --shadow:0 14px 30px -18px rgba(70,40,10,.45); color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#efe5d2; --bg2:#e6d9c1; --panel:#fbf5ea; --panel2:#f3e9d7; --line:#d8c7a8; --line2:#c1a97f;
  --ink:#2a1c12; --ink2:#4d3a2a; --muted:#806a52;
  --gold:#9a6a12; --gold2:#7a520a; --ember:#c0431d; --blood:#9a1f17; --blood2:#b5281c;
  --q0:#777; --q1:#3a3a3a; --q2:#178a00; --q3:#0b5fd1; --q4:#7d2fc9; --q5:#c45f00;
  --green:#1d8a3a; --new:#b36b00; --shadow:0 14px 30px -18px rgba(70,40,10,.45); color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--sans);overflow-x:hidden;
  background-image:
    radial-gradient(1200px 520px at 50% -180px, color-mix(in srgb,var(--blood) 38%,transparent), transparent 70%),
    radial-gradient(700px 400px at 100% 0, color-mix(in srgb,var(--ember) 14%,transparent), transparent 70%),
    linear-gradient(var(--bg),var(--bg2));
  background-attachment:fixed;}
a{color:var(--gold2)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand svg{width:30px;height:30px;flex:none}
.brand b{font:700 16px/1.1 var(--serif);letter-spacing:.06em}
.brand small{display:block;font:600 10px/1.2 var(--disp);letter-spacing:.22em;color:var(--gold);text-transform:uppercase}
.nav{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.nav a{padding:5px 14px;border-radius:999px;text-decoration:none;color:var(--ink2);font-weight:600;font-size:14px;white-space:nowrap}
.nav a[aria-current="page"]{background:linear-gradient(180deg,var(--blood2),var(--blood));color:#fff;box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 45%,transparent) inset}
.picker{position:relative;display:flex;align-items:center}
.picker select{appearance:none;-webkit-appearance:none;background:var(--panel);border:1px solid var(--line2);border-radius:10px;
  padding:7px 34px 7px 12px;font-weight:700;color:var(--ink);cursor:pointer;max-width:62vw}
.picker::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.picker label{font-size:12px;color:var(--muted);margin-right:8px;white-space:nowrap}
.theme-btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:36px;height:36px;cursor:pointer;display:grid;place-items:center}

.wrap{max-width:1180px;margin:0 auto;padding:0 16px 80px}

/* hero */
.hero{position:relative;margin:26px 0 22px;padding:34px 30px 28px;border-radius:22px;overflow:hidden;
  border:1px solid var(--line2);background:
   radial-gradient(600px 260px at 85% 10%, color-mix(in srgb,var(--accent,var(--ember)) 30%,transparent), transparent 70%),
   linear-gradient(135deg,var(--panel2),var(--panel));box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(115deg,transparent 0 22px,color-mix(in srgb,var(--gold) 5%,transparent) 22px 23px)}
.hero .sig{position:absolute;right:-30px;top:-30px;width:260px;height:260px;opacity:.13;color:var(--accent,var(--gold))}
.hero .kicker{font:600 12px/1 var(--disp);letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.hero h1{margin:10px 0 6px;font:900 clamp(30px,5.4vw,52px)/1.08 var(--serif);letter-spacing:.04em;
  background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,var(--ember));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1 em{font-style:normal;color:var(--accent,var(--gold2));-webkit-text-fill-color:var(--accent,var(--gold2))}
.hero .en{font:600 14px/1.3 var(--disp);letter-spacing:.14em;color:var(--ink2)}
.hero p{max-width:760px;color:var(--ink2);margin:14px 0 0}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;position:relative}
.stat{min-width:104px;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--bg) 55%,transparent);border:1px solid var(--line)}
.stat b{display:block;font:800 24px/1.1 var(--serif);color:var(--gold2)}
.stat span{font-size:12px;color:var(--muted)}

/* toolbar */
.toolbar{position:sticky;top:57px;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;margin-bottom:10px;
  background:linear-gradient(var(--bg) 70%,transparent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);padding:5px 12px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--bg);background:linear-gradient(180deg,var(--gold2),var(--gold))}
.chip .n{opacity:.7;font-weight:500;margin-left:4px}
.search{flex:1 1 180px;min-width:150px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 12px}
.check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);cursor:pointer;white-space:nowrap}

/* band rail */
.rail{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:4px 0 18px}
.rail button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 6px;cursor:pointer;text-align:center;position:relative;overflow:hidden}
.rail button b{display:block;font:800 16px/1.2 var(--serif)}
.rail button span{font-size:11px;color:var(--muted)}
.rail button::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--bc)}
.rail button[aria-pressed="true"]{border-color:var(--gold);background:var(--panel2);box-shadow:0 0 0 1px var(--gold) inset}

/* section headings */
.band-h{display:flex;align-items:baseline;gap:14px;margin:34px 0 14px;scroll-margin-top:120px}
.band-h h2{margin:0;font:900 30px/1 var(--serif);color:var(--gold2)}
.band-h h2 small{font:600 13px var(--sans);color:var(--muted);margin-left:8px}
.band-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.zone-h{display:flex;align-items:center;gap:8px;margin:20px 0 10px;font:700 15px var(--serif);color:var(--ink2)}
.zone-h::before{content:"";width:8px;height:8px;transform:rotate(45deg);background:var(--ember);box-shadow:0 0 10px var(--ember)}
.card .zone-h{margin:-2px 30px 10px 0;font-size:12.5px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.card .zone-h::before{width:6px;height:6px}
.zone-h i{font:500 12px var(--disp);color:var(--muted);font-style:normal;letter-spacing:.1em}

/* item cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.card{position:relative;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,var(--panel2),var(--panel));
  padding:14px 14px 12px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;min-width:0}
.card:hover{transform:translateY(-2px);border-color:var(--line2)}
.card.done{opacity:.5}
.card .top{display:flex;gap:12px;align-items:flex-start}
.icon{flex:none;width:52px;height:52px;border-radius:10px;border:2px solid var(--qc,var(--q1));overflow:hidden;position:relative;
  background:#000;box-shadow:0 0 14px -2px var(--qc,transparent),inset 0 0 0 1px rgba(0,0,0,.6)}
.icon img{width:100%;height:100%;display:block;object-fit:cover}
.icon .fb{position:absolute;inset:0;display:grid;place-items:center;font:900 20px var(--serif);color:var(--qc);background:radial-gradient(circle at 30% 25%,#3a2a1c,#120c08)}
.icon img+ .fb{display:none}
.nm{min-width:0;flex:1}
.nm a.iname{font:800 17px/1.25 var(--serif);color:var(--qc,var(--ink));text-decoration:none;word-break:break-word}
.nm a.iname:hover{text-decoration:underline}
.nm .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.tag.must{background:linear-gradient(180deg,var(--blood2),var(--blood));border-color:transparent;color:#fff}
.tag.rec{border-color:var(--gold);color:var(--gold2)}
.tag.opt{color:var(--muted)}
.tag.new{border-color:var(--new);color:var(--new)}
.tag.dg{border-color:var(--ember);color:var(--ember);text-decoration:none}
.tag.choice{border-style:dashed}
.tick{position:absolute;top:12px;right:12px;width:22px;height:22px;accent-color:var(--gold);cursor:pointer}
.statbox{margin:10px 0 0;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,#000 30%,transparent);border:1px solid var(--line);
  font-size:13px;color:var(--green);line-height:1.55}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .statbox{background:color-mix(in srgb,#fff 50%,transparent)}}
:root[data-theme="light"] .statbox{background:color-mix(in srgb,#fff 50%,transparent)}
.verdict{margin:10px 0 0;padding:7px 10px;border-radius:10px;font-size:13px;line-height:1.5}
.verdict.keep{background:color-mix(in srgb,var(--gold) 13%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent)}
.verdict.keep::before{content:"✔ ";color:var(--gold2);font-weight:800}
.verdict.skip{background:color-mix(in srgb,var(--blood) 16%,transparent);color:var(--ink2);border:1px solid color-mix(in srgb,var(--blood2) 40%,transparent)}
.verdict.skip::before{content:"✗ ";color:var(--blood2);font-weight:800}
.verdict b{color:var(--gold2)}
.verdict.bonus{background:color-mix(in srgb,var(--q3) 13%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--q3) 40%,transparent)}
.verdict.bonus::before{content:"💎 "}
.card.drop{border-style:dashed;border-color:color-mix(in srgb,var(--q3) 45%,var(--line));background:radial-gradient(260px 120px at 100% 0,color-mix(in srgb,var(--q3) 14%,transparent),transparent 70%),linear-gradient(180deg,var(--panel2),var(--panel))}
.tag.drop{border-color:var(--q3);color:var(--q3)}
.card.skipped{opacity:.72}
.why{margin:8px 0 0;font-size:13.5px;color:var(--ink2)}
.qline{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink2)}
.qline .qn{font-weight:800;color:var(--gold2)}
.qline .where{color:var(--muted)}
.chain{margin:8px 0 0;padding:0;list-style:none;counter-reset:s;position:relative}
.chain li{position:relative;padding:0 0 8px 28px;font-size:13px;color:var(--ink2)}
.chain li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:1px;width:19px;height:19px;border-radius:50%;
  display:grid;place-items:center;font:700 11px var(--mono);background:var(--panel);border:1px solid var(--line2);color:var(--gold)}
.chain li::after{content:"";position:absolute;left:9px;top:21px;bottom:2px;width:1px;background:var(--line2)}
.chain li:last-child::after{display:none}
.chain li.final::before{content:"★";background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--bg);border-color:transparent}
.chain li.opt{opacity:.7}
.chain b{color:var(--ink)}
details.more{margin-top:6px}
details.more summary{cursor:pointer;font-size:12.5px;color:var(--gold);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸ "}
details.more[open] summary::before{content:"▾ "}
.notes{font-size:12.5px;color:var(--muted);margin-top:6px}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:16px}

/* dungeon pages */
.ribbon{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:16px 16px 10px;margin-bottom:22px;box-shadow:var(--shadow)}
.ribbon h3{margin:0 0 10px;font:800 18px var(--serif);color:var(--gold2)}
.rrow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:center;padding:3px 0;text-decoration:none;color:var(--ink)}
.rrow:hover .rname{color:var(--gold2)}
.rname{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtrack{position:relative;height:20px;border-radius:6px;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 10%)}
.rbar{position:absolute;top:2px;bottom:2px;border-radius:5px;background:linear-gradient(90deg,var(--c1),var(--c2));display:flex;align-items:center;padding:0 6px;
  font:700 11px var(--mono);color:#160d06;white-space:nowrap;min-width:38px;box-shadow:0 0 12px -3px var(--c2)}
.rticks{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;font:11px var(--mono);color:var(--muted)}
.rticks div{position:relative;height:16px}
.rticks span{position:absolute;transform:translateX(-50%)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.dcard{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:16px;position:relative;overflow:hidden;
  background:radial-gradient(240px 120px at 100% 0,color-mix(in srgb,var(--c,var(--ember)) 22%,transparent),transparent 70%),linear-gradient(180deg,var(--panel2),var(--panel));transition:transform .15s,border-color .15s}
.dcard:hover{transform:translateY(-3px);border-color:var(--gold)}
.dcard .lv{font:800 13px var(--mono);color:var(--c)}
.dcard h4{margin:4px 0 0;font:900 20px/1.2 var(--serif)}
.dcard .den{font:600 11px var(--disp);letter-spacing:.12em;color:var(--muted)}
.dcard .meta{display:flex;gap:10px;margin-top:10px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin-bottom:18px}
.box{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:12px 14px;font-size:13.5px;color:var(--ink2);min-width:0}
.box h5{margin:0 0 6px;font:700 12px var(--sans);letter-spacing:.1em;color:var(--gold)}
.box ul{margin:0;padding-left:18px}
.qcard{border-left:3px solid var(--cc,var(--line2))}
.qcard h4{margin:0;font:800 17px/1.3 var(--serif);color:var(--ink);padding-right:30px}
.qcard .qen{font:500 12px var(--disp);color:var(--muted);letter-spacing:.06em}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;font-size:13px;margin-top:10px}
.kv dt{color:var(--muted);white-space:nowrap}
.kv dd{margin:0;color:var(--ink2)}
.kv dd.rw{color:var(--green)}
.tip{margin-top:8px;font-size:13px;padding:7px 10px;border-radius:10px;background:color-mix(in srgb,var(--gold) 10%,transparent);color:var(--ink2)}
.tip::before{content:"提示　";font-weight:800;color:var(--gold)}
footer{margin-top:50px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}

@media (max-width:640px){
  .hero{padding:24px 18px 20px;border-radius:18px}
  .rail{grid-template-columns:repeat(3,minmax(0,1fr))}
  .rrow,.rticks{grid-template-columns:78px minmax(0,1fr)}
  .rname{font-size:12px}
  .toolbar{top:0;position:relative}
  .topbar{position:relative}
  .brand small{display:none}
  .picker label{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.card.craft{border-style:dashed;border-color:color-mix(in srgb,var(--q2) 50%,var(--line));background:radial-gradient(260px 120px at 100% 0,color-mix(in srgb,var(--q2) 13%,transparent),transparent 70%),linear-gradient(180deg,var(--panel2),var(--panel))}
.tag.craft{border-color:var(--q2);color:var(--q2)}
.verdict.bonus.craft{border-color:color-mix(in srgb,var(--q2) 55%,transparent)}
.verdict.bonus.craft{background:color-mix(in srgb,var(--q2) 11%,transparent)}
.verdict.bonus.craft::before{content:"🧵 "}

/* leveling route */
.racepick{display:flex;gap:6px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.racepick button{border:0;background:none;padding:5px 12px;border-radius:999px;cursor:pointer;font-weight:700;font-size:13px;color:var(--ink2);white-space:nowrap}
.racepick button[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--bg)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:14px 0 0;font-size:13px;color:var(--ink2);position:relative}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tag.gold{border-color:#d9a400;color:#f2c94c}
.tag.pre{border-color:var(--blood2);color:var(--blood2)}
.tag.skipt{color:var(--muted);border-style:dashed}
.tag.cls{border-color:var(--cls);color:var(--cls)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .tag.gold{color:#8a6400;border-color:#b88a00}}
:root[data-theme="light"] .tag.gold{color:#8a6400;border-color:#b88a00}
.lvrail{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:4px 0 14px}
.lvrail a{display:block;text-align:center;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 4px;text-decoration:none;color:var(--ink);position:relative;overflow:hidden}
.lvrail a b{display:block;font:800 16px/1.2 var(--serif)}
.lvrail a span{font-size:11px;color:var(--muted)}
.lvrail a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--bc)}
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--lv-lo),var(--lv-mid) 50%,var(--lv-hi))}
.step{position:relative;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,var(--panel2),var(--panel));padding:14px 14px 10px;margin:0 0 14px;box-shadow:var(--shadow);scroll-margin-top:150px;min-width:0}
.step::before{content:"";position:absolute;left:-23px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--sc,var(--gold));box-shadow:0 0 0 3px var(--bg),0 0 12px var(--sc,var(--gold))}
.step.dg{border-color:color-mix(in srgb,var(--ember) 55%,var(--line));background:radial-gradient(320px 140px at 100% 0,color-mix(in srgb,var(--ember) 18%,transparent),transparent 70%),linear-gradient(180deg,var(--panel2),var(--panel))}
.step.dg::before{border-radius:3px;transform:rotate(45deg);background:var(--ember);box-shadow:0 0 0 3px var(--bg),0 0 12px var(--ember)}
.step.city{border-style:dashed}
.step-h{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.lvb{flex:none;font:800 15px/1 var(--mono);padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--sc,var(--gold)) 18%,transparent);color:var(--sc,var(--gold2));border:1px solid color-mix(in srgb,var(--sc,var(--gold)) 45%,transparent);white-space:nowrap}
.step-h .tt{flex:1;min-width:0}
.step-h h3{margin:0;font:900 20px/1.25 var(--serif);color:var(--ink)}
.step-h h3 i{font:600 12px var(--disp);letter-spacing:.08em;color:var(--muted);font-style:normal;margin-left:6px}
.step-h h3 a{color:inherit;text-decoration:none}
.step-h h3 a:hover{color:var(--gold2)}
.hubs{font-size:13px;color:var(--ink2);margin-top:2px}
.sum{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sum span{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.sum span b{color:var(--ink)}
.tips{margin:10px 0 2px;padding:0;list-style:none;font-size:13.5px;color:var(--ink2)}
.tips li{position:relative;padding:2px 0 2px 18px}
.tips li::before{content:"›";position:absolute;left:4px;color:var(--gold);font-weight:800}
.tips li.train::before{content:"✦";left:2px;color:var(--cls)}
.tips li.warn::before{content:"!";left:6px;color:var(--ember)}
.qlist{margin-top:10px;border-top:1px dashed var(--line)}
.qr{display:grid;grid-template-columns:22px 34px minmax(0,1fr) auto;gap:4px 10px;align-items:start;padding:8px 2px;border-bottom:1px dashed var(--line)}
.qr:last-child{border-bottom:0}
.qr.done{opacity:.45}
.qr input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--gold);cursor:pointer}
.ql{font:700 12px/1 var(--mono);padding:4px 0;border-radius:6px;text-align:center;background:var(--panel);border:1px solid var(--line);color:var(--ink2);margin-top:1px}
.qm{min-width:0}
.qm a.qn{font-weight:700;color:var(--ink);text-decoration:none;word-break:break-word}
.qm a.qn:hover{color:var(--gold2);text-decoration:underline}
.qm .tags{display:inline-flex;margin:0 0 0 6px;vertical-align:1px}
.qd{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.qd b{color:var(--ink2);font-weight:600}
.qd .gi{color:var(--qc,var(--q2));font-weight:700}
.qv{text-align:right;font:700 13px/1.3 var(--mono);color:var(--gold2);white-space:nowrap}
.qv small{display:block;font:500 11px var(--sans);color:var(--muted)}
.qv.low{color:var(--muted)}
details.skipd{margin-top:4px}
details.skipd>summary{cursor:pointer;font-size:13px;color:var(--muted);padding:6px 2px;list-style:none}
details.skipd>summary::-webkit-details-marker{display:none}
details.skipd>summary::before{content:"▸ "}
details.skipd[open]>summary::before{content:"▾ "}
.dgq{margin:10px 0 0;padding:0;list-style:none;font-size:13px}
.dgq li{padding:5px 0;border-bottom:1px dashed var(--line);color:var(--ink2)}
.dgq li:last-child{border-bottom:0}
.dgq b{color:var(--ink)}
.dgq .w{color:var(--muted)}
.dglink{display:inline-block;margin-top:10px;font-size:13px;font-weight:700;color:var(--ember);text-decoration:none}
.dglink:hover{text-decoration:underline}
.basetbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
.basetbl th,.basetbl td{padding:3px 6px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono)}
.basetbl th{color:var(--muted);font-weight:600}
.basewrap{overflow-x:auto}
.band-anchor{scroll-margin-top:150px}
@media (max-width:640px){
  .lvrail{grid-template-columns:repeat(3,minmax(0,1fr))}
  .timeline{padding-left:18px}
  .timeline::before{left:5px}
  .step::before{left:-19px}
  .qr{grid-template-columns:20px 30px minmax(0,1fr);}
  .qv{grid-column:3;text-align:left}
  .qv small{display:inline;margin-left:6px}
  .step-h h3{font-size:18px}
}
</style>
</head>

    ${tips ? `<ul class="tips">${tips}</ul>` : ""}
    ${main.length ? `<div class="qlist">${main.map(row).join("")}</div>` : ""}
    ${skip.length && st.view !== "must" ? (st.view === "all" ? `<div class="qlist">${skip.map(row).join("")}</div>` : `<details class="skipd"><summary>可略過 ${skip.length} 個（金錢＋賣價低於該等級平均，只有經驗）</summary><div class="qlist">${skip.map(row).join("")}</div></details>`) : ""}
  </section>`;
}
function dgCard(s) {
  const d = R.dungeons[s.dg]; if (!d) return "";
  const qs = d.quests;
  if (st.q && !norm([d.zh, d.en, ...qs.map(q => q.zh + " " + q.where)].join(" ")).includes(st.q)) return "";
  const li = qs.map(q => `<li><b>${esc(q.zh)}</b>${q.lv ? ` <span class="w">${q.lv} 級</span>` : ""}${q.tag ? ` <span class="tag ${TAGS[q.tag][0]}">${TAGS[q.tag][1]}</span>` : ""}<br><span class="w">${esc(q.where || "")}${q.req ? `・${q.req} 級可接` : ""}${q.reward ? `・獎勵 ${esc(q.reward)}` : ""}</span></li>`).join("");
  return `<section class="step dg" id="s-${esc(s.id)}">
    <div class="step-h"><span class="lvb" style="--sc:var(--ember)">⚔ ${s.lv[0]}${s.lv[1] && s.lv[1] !== s.lv[0] ? "–" + s.lv[1] : ""}</span>
      <div class="tt"><h3><a href="dungeons.html#${esc(s.dg)}">${esc(d.zh)}</a><i>${esc(d.en)}</i></h3><div class="hubs">副本建議等級 ${esc(d.range || "")} · ${esc(d.where || "")}</div>
      <div class="sum"><span>部落任務 <b>${qs.length}</b></span>${qs.some(q => q.tag === "gear") ? `<span>含必拿裝備 <b>${qs.filter(q => q.tag === "gear").length}</b></span>` : ""}</div></div></div>
    <ul class="tips">${(s.tips || []).map(t => `<li class="${t.k || ""}">${esc(t.t)}</li>`).join("")}</ul>
    ${li ? `<details class="skipd" ${qs.some(q => q.tag === "gear") ? "open" : ""}><summary>進本前要接的任務（${qs.length}）</summary><ul class="dgq">${li}</ul></details>` : ""}
    <a class="dglink" href="dungeons.html#${esc(s.dg)}">→ 副本任務圖鑑看完整前置與攻略</a>
  </section>`;
}
function render() {
  const steps = R.steps.filter(s => !s.race || s.race === st.race);
  const allQ = [...new Set(steps.flatMap(stepIds))].map(id => R.quests[id]).filter(Boolean);
  const must = allQ.filter(q => ["gear", "pre", "cls"].includes(q.tag)), gold = allQ.filter(q => q.tag === "gold");
  const got = allQ.filter(q => done[q.id]).length;
  const rc = R.races[st.race];
  document.getElementById("hero").innerHTML = `${SIGIL}
    <div class="kicker">WoW Forever · Horde · Mage Leveling</div>
    <h1><em>法師</em>　練級路線</h1>
    <div class="en">LEVEL 1–60 · QUEST ROUTE · DUNGEON TIMING</div>
    <p>${esc(R.meta.intro)}</p>
    <div class="stats">
      <div class="stat"><b>${steps.filter(s => !s.dg).length}</b><span>個練級階段</span></div>
      <div class="stat"><b>${steps.filter(s => s.dg).length}</b><span>個副本時機</span></div>
      <div class="stat"><b>${must.length}</b><span>必做任務</span></div>
      <div class="stat"><b>${gold.length}</b><span>建議做（錢）</span></div>
      <div class="stat"><b>${money(must.concat(gold).reduce((a, q) => a + (q.value || 0), 0)).replace(/ \d+s$/, "")}</b><span>必做＋建議 金錢與賣價</span></div>
      <div class="stat"><b>${got}<small style="font-size:14px;color:var(--muted)">/${allQ.length}</small></b><span>已完成</span></div>
    </div>
    <div class="legend"><span><span class="tag must">必做・裝備</span>拿裝備頁的必拿／推薦裝備</span><span><span class="tag pre">必做・前置</span>裝備任務鏈的前置</span><span><span class="tag cls">法師職業</span>職業技能／裝備任務</span><span><span class="tag gold">建議做・錢</span>金錢＋最值錢獎勵賣價 ≥ 該等級平均</span><span><span class="tag skipt">可略過</span>只剩經驗</span></div>`;
  document.getElementById("race").innerHTML = Object.entries(R.races).map(([k, r]) => `<button type="button" data-r="${k}" aria-pressed="${st.race === k}">${esc(r.zh)}</button>`).join("");
  document.getElementById("view").innerHTML = VIEWS.map(([v, l]) => `<button type="button" class="chip" data-v="${v}" aria-pressed="${st.view === v}">${l}</button>`).join("");
  document.getElementById("lvrail").innerHTML = BANDS.map(([a, b], i) => { return `<a href="#band-${a}" style="--bc:${BAND_C[i]}"><b>${a === 1 ? 1 : a}-${b}</b><span>${steps.filter(s => s.lv[0] >= a && s.lv[0] < b && !s.dg).length} 階段・${steps.filter(s => s.dg && s.lv[0] >= a && s.lv[0] < b).length} 副本</span></a>`; }).join("");
  let html = "", bi = 0;
  for (const s of steps) {
    while (bi < BANDS.length && s.lv[0] >= BANDS[bi][0]) { html += `<div class="band-anchor" id="band-${BANDS[bi][0]}"></div>`; bi++; }
    html += s.dg ? dgCard(s) : stepCard(s);
  }
  while (bi < BANDS.length) { html += `<div class="band-anchor" id="band-${BANDS[bi][0]}"></div>`; bi++; }
  document.getElementById("list").innerHTML = html || `<div class="empty">沒有符合條件的任務。</div>`;
  const B = R.meta.baseline;
  const lvs = Object.keys(B).map(Number).sort((a, b) => a - b);
  const rows = []; for (let i = 0; i < lvs.length; i += 10) rows.push(lvs.slice(i, i + 10));
  document.getElementById("foot").innerHTML = `<b>怎麼分類</b><br>${R.meta.method.map(esc).join("<br>")}
    <details class="more"><summary>各等級 CP 值基準（該任務等級前後 1 級、部落可接任務的平均「金錢＋最值錢獎勵賣價」）</summary><div class="basewrap"><table class="basetbl">${rows.map(r => `<tr>${r.map(l => `<th>${l}</th>`).join("")}</tr><tr>${r.map(l => `<td>${money(B[l])}</td>`).join("")}</tr>`).join("")}</table></div></details>
    <br>資料：任務等級、金錢、經驗、獎勵取自 forever.warcraftdb.com（永恆資料庫）與 classicdb.ch（經典版補缺），繁中名稱與物品賣價取自 Wowhead 永恆台服資料庫，區域等級與新地圖資訊參考 Warcraft Tavern 永恆指南。資料核對日期 ${esc(R.meta.checked_at)}。勾選只存在這台裝置的瀏覽器。<br>來源：${R.meta.sources.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\/(www\.)?/, "").slice(0, 46))}</a>`).join("、")}`;
}
document.getElementById("race").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; st.race = b.dataset.r; store.set("wowf-route-race", st.race); render(); });
document.getElementById("view").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; st.view = b.dataset.v; store.set("wowf-route-view", st.view); render(); });
document.getElementById("q").addEventListener("input", e => { st.q = norm(e.target.value.trim()); render(); });
const hide = document.getElementById("hide"); hide.checked = st.hide;
hide.addEventListener("change", () => { st.hide = hide.checked; store.set("wowf-route-hide", st.hide); render(); });
document.getElementById("list").addEventListener("change", e => { const t = e.target.closest("input[data-q]"); if (!t) return; if (t.checked) done[t.dataset.q] = 1; else delete done[t.dataset.q]; store.set(DONE_KEY, done); render(); });
if (!R.races[st.race]) st.race = Object.keys(R.races)[0];
render();
if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
</script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天賦模擬器 · 魔獸永恆部落</title>
<meta name="description" content="魔獸永恆部落 9 職業天賦模擬器：永恆版天賦樹、繁中說明、推薦練級與滿級點法，可依等級播放加點順序並分享連結。">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#0d0907; --bg2:#15100c; --panel:#1b1410; --panel2:#231a14; --line:#3a2a1f; --line2:#56402e;
  --ink:#eee3cf; --ink2:#c9b99e; --muted:#8f7d66;
  --gold:#e0b25b; --gold2:#f4d48f; --ember:#e2552b; --blood:#a8231a; --blood2:#d43b2a;
  --q0:#9d9d9d; --q1:#f2f2f2; --q2:#1eff00; --q3:#3c95ff; --q4:#b465ff; --q5:#ff8000;
  --green:#4fd36b; --cls:#69ccf0; --new:#ffb627;
  --lv-lo:#5fbf6a; --lv-mid:#e0b25b; --lv-hi:#e2552b;
  --shadow:0 18px 40px -18px rgba(0,0,0,.8);
  --serif:"Noto Serif TC","Songti TC",serif; --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --disp:"Cinzel","Noto Serif TC",serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#efe5d2; --bg2:#e6d9c1; --panel:#fbf5ea; --panel2:#f3e9d7; --line:#d8c7a8; --line2:#c1a97f;
  --ink:#2a1c12; --ink2:#4d3a2a; --muted:#806a52;
  --gold:#9a6a12; --gold2:#7a520a; --ember:#c0431d; --blood:#9a1f17; --blood2:#b5281c;
  --q0:#777; --q1:#3a3a3a; --q2:#178a00; --q3:#0b5fd1; --q4:#7d2fc9; --q5:#c45f00;
  --green:#1d8a3a; --new:#b36b00; --shadow:0 14px 30px -18px rgba(70,40,10,.45); color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#efe5d2; --bg2:#e6d9c1; --panel:#fbf5ea; --panel2:#f3e9d7; --line:#d8c7a8; --line2:#c1a97f;
  --ink:#2a1c12; --ink2:#4d3a2a; --muted:#806a52;
  --gold:#9a6a12; --gold2:#7a520a; --ember:#c0431d; --blood:#9a1f17; --blood2:#b5281c;
  --q0:#777; --q1:#3a3a3a; --q2:#178a00; --q3:#0b5fd1; --q4:#7d2fc9; --q5:#c45f00;
  --green:#1d8a3a; --new:#b36b00; --shadow:0 14px 30px -18px rgba(70,40,10,.45); color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--sans);overflow-x:hidden;
  background-image:
    radial-gradient(1200px 520px at 50% -180px, color-mix(in srgb,var(--blood) 38%,transparent), transparent 70%),
    radial-gradient(700px 400px at 100% 0, color-mix(in srgb,var(--ember) 14%,transparent), transparent 70%),
    linear-gradient(var(--bg),var(--bg2));
  background-attachment:fixed;}
a{color:var(--gold2)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand svg{width:30px;height:30px;flex:none}
.brand b{font:700 16px/1.1 var(--serif);letter-spacing:.06em}
.brand small{display:block;font:600 10px/1.2 var(--disp);letter-spacing:.22em;color:var(--gold);text-transform:uppercase}
.nav{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.nav a{padding:5px 14px;border-radius:999px;text-decoration:none;color:var(--ink2);font-weight:600;font-size:14px;white-space:nowrap}
.nav a[aria-current="page"]{background:linear-gradient(180deg,var(--blood2),var(--blood));color:#fff;box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 45%,transparent) inset}
.picker{position:relative;display:flex;align-items:center}
.picker select{appearance:none;-webkit-appearance:none;background:var(--panel);border:1px solid var(--line2);border-radius:10px;
  padding:7px 34px 7px 12px;font-weight:700;color:var(--ink);cursor:pointer;max-width:62vw}
.picker::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.picker label{font-size:12px;color:var(--muted);margin-right:8px;white-space:nowrap}
.theme-btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:36px;height:36px;cursor:pointer;display:grid;place-items:center}

.wrap{max-width:1180px;margin:0 auto;padding:0 16px 80px}

/* hero */
.hero{position:relative;margin:26px 0 22px;padding:34px 30px 28px;border-radius:22px;overflow:hidden;
  border:1px solid var(--line2);background:
   radial-gradient(600px 260px at 85% 10%, color-mix(in srgb,var(--accent,var(--ember)) 30%,transparent), transparent 70%),
   linear-gradient(135deg,var(--panel2),var(--panel));box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(115deg,transparent 0 22px,color-mix(in srgb,var(--gold) 5%,transparent) 22px 23px)}
.hero .sig{position:absolute;right:-30px;top:-30px;width:260px;height:260px;opacity:.13;color:var(--accent,var(--gold))}
.hero .kicker{font:600 12px/1 var(--disp);letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.hero h1{margin:10px 0 6px;font:900 clamp(30px,5.4vw,52px)/1.08 var(--serif);letter-spacing:.04em;
  background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,var(--ember));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1 em{font-style:normal;color:var(--accent,var(--gold2));-webkit-text-fill-color:var(--accent,var(--gold2))}
.hero .en{font:600 14px/1.3 var(--disp);letter-spacing:.14em;color:var(--ink2)}
.hero p{max-width:760px;color:var(--ink2);margin:14px 0 0}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;position:relative}
.stat{min-width:104px;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--bg) 55%,transparent);border:1px solid var(--line)}
.stat b{display:block;font:800 24px/1.1 var(--serif);color:var(--gold2)}
.stat span{font-size:12px;color:var(--muted)}

/* toolbar */
.toolbar{position:sticky;top:57px;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;margin-bottom:10px;
  background:linear-gradient(var(--bg) 70%,transparent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);padding:5px 12px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--bg);background:linear-gradient(180deg,var(--gold2),var(--gold))}
.chip .n{opacity:.7;font-weight:500;margin-left:4px}
.search{flex:1 1 180px;min-width:150px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 12px}
.check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);cursor:pointer;white-space:nowrap}

/* band rail */
.rail{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:4px 0 18px}
.rail button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 6px;cursor:pointer;text-align:center;position:relative;overflow:hidden}
.rail button b{display:block;font:800 16px/1.2 var(--serif)}
.rail button span{font-size:11px;color:var(--muted)}
.rail button::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--bc)}
.rail button[aria-pressed="true"]{border-color:var(--gold);background:var(--panel2);box-shadow:0 0 0 1px var(--gold) inset}

/* section headings */
.band-h{display:flex;align-items:baseline;gap:14px;margin:34px 0 14px;scroll-margin-top:120px}
.band-h h2{margin:0;font:900 30px/1 var(--serif);color:var(--gold2)}
.band-h h2 small{font:600 13px var(--sans);color:var(--muted);margin-left:8px}
.band-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.zone-h{display:flex;align-items:center;gap:8px;margin:20px 0 10px;font:700 15px var(--serif);color:var(--ink2)}
.zone-h::before{content:"";width:8px;height:8px;transform:rotate(45deg);background:var(--ember);box-shadow:0 0 10px var(--ember)}
.card .zone-h{margin:-2px 30px 10px 0;font-size:12.5px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.card .zone-h::before{width:6px;height:6px}
.zone-h i{font:500 12px var(--disp);color:var(--muted);font-style:normal;letter-spacing:.1em}

/* item cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.card{position:relative;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,var(--panel2),var(--panel));
  padding:14px 14px 12px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;min-width:0}
.card:hover{transform:translateY(-2px);border-color:var(--line2)}
.card.done{opacity:.5}
.card .top{display:flex;gap:12px;align-items:flex-start}
.icon{flex:none;width:52px;height:52px;border-radius:10px;border:2px solid var(--qc,var(--q1));overflow:hidden;position:relative;
  background:#000;box-shadow:0 0 14px -2px var(--qc,transparent),inset 0 0 0 1px rgba(0,0,0,.6)}
.icon img{width:100%;height:100%;display:block;object-fit:cover}
.icon .fb{position:absolute;inset:0;display:grid;place-items:center;font:900 20px var(--serif);color:var(--qc);background:radial-gradient(circle at 30% 25%,#3a2a1c,#120c08)}
.icon img+ .fb{display:none}
.nm{min-width:0;flex:1}
.nm a.iname{font:800 17px/1.25 var(--serif);color:var(--qc,var(--ink));text-decoration:none;word-break:break-word}
.nm a.iname:hover{text-decoration:underline}
.nm .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.tag.must{background:linear-gradient(180deg,var(--blood2),var(--blood));border-color:transparent;color:#fff}
.tag.rec{border-color:var(--gold);color:var(--gold2)}
.tag.opt{color:var(--muted)}
.tag.new{border-color:var(--new);color:var(--new)}
.tag.dg{border-color:var(--ember);color:var(--ember);text-decoration:none}
.tag.choice{border-style:dashed}
.tick{position:absolute;top:12px;right:12px;width:22px;height:22px;accent-color:var(--gold);cursor:pointer}
.statbox{margin:10px 0 0;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,#000 30%,transparent);border:1px solid var(--line);
  font-size:13px;color:var(--green);line-height:1.55}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .statbox{background:color-mix(in srgb,#fff 50%,transparent)}}
:root[data-theme="light"] .statbox{background:color-mix(in srgb,#fff 50%,transparent)}
.verdict{margin:10px 0 0;padding:7px 10px;border-radius:10px;font-size:13px;line-height:1.5}
.verdict.keep{background:color-mix(in srgb,var(--gold) 13%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent)}
.verdict.keep::before{content:"✔ ";color:var(--gold2);font-weight:800}
.verdict.skip{background:color-mix(in srgb,var(--blood) 16%,transparent);color:var(--ink2);border:1px solid color-mix(in srgb,var(--blood2) 40%,transparent)}
.verdict.skip::before{content:"✗ ";color:var(--blood2);font-weight:800}
.verdict b{color:var(--gold2)}
.verdict.bonus{background:color-mix(in srgb,var(--q3) 13%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--q3) 40%,transparent)}
.verdict.bonus::before{content:"💎 "}
.card.drop{border-style:dashed;border-color:color-mix(in srgb,var(--q3) 45%,var(--line));background:radial-gradient(260px 120px at 100% 0,color-mix(in srgb,var(--q3) 14%,transparent),transparent 70%),linear-gradient(180deg,var(--panel2),var(--panel))}
.tag.drop{border-color:var(--q3);color:var(--q3)}
.card.skipped{opacity:.72}
.why{margin:8px 0 0;font-size:13.5px;color:var(--ink2)}
.qline{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink2)}
.qline .qn{font-weight:800;color:var(--gold2)}
.qline .where{color:var(--muted)}
.chain{margin:8px 0 0;padding:0;list-style:none;counter-reset:s;position:relative}
.chain li{position:relative;padding:0 0 8px 28px;font-size:13px;color:var(--ink2)}
.chain li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:1px;width:19px;height:19px;border-radius:50%;
  display:grid;place-items:center;font:700 11px var(--mono);background:var(--panel);border:1px solid var(--line2);color:var(--gold)}
.chain li::after{content:"";position:absolute;left:9px;top:21px;bottom:2px;width:1px;background:var(--line2)}
.chain li:last-child::after{display:none}
.chain li.final::before{content:"★";background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--bg);border-color:transparent}
.chain li.opt{opacity:.7}
.chain b{color:var(--ink)}
details.more{margin-top:6px}
details.more summary{cursor:pointer;font-size:12.5px;color:var(--gold);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸ "}
details.more[open] summary::before{content:"▾ "}
.notes{font-size:12.5px;color:var(--muted);margin-top:6px}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:16px}

/* dungeon pages */
.ribbon{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:16px 16px 10px;margin-bottom:22px;box-shadow:var(--shadow)}
.ribbon h3{margin:0 0 10px;font:800 18px var(--serif);color:var(--gold2)}
.rrow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:center;padding:3px 0;text-decoration:none;color:var(--ink)}
.rrow:hover .rname{color:var(--gold2)}
.rname{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtrack{position:relative;height:20px;border-radius:6px;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 10%)}
.rbar{position:absolute;top:2px;bottom:2px;border-radius:5px;background:linear-gradient(90deg,var(--c1),var(--c2));display:flex;align-items:center;padding:0 6px;
  font:700 11px var(--mono);color:#160d06;white-space:nowrap;min-width:38px;box-shadow:0 0 12px -3px var(--c2)}
.rticks{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;font:11px var(--mono);color:var(--muted)}
.rticks div{position:relative;height:16px}
.rticks span{position:absolute;transform:translateX(-50%)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.dcard{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:16px;position:relative;overflow:hidden;
  background:radial-gradient(240px 120px at 100% 0,color-mix(in srgb,var(--c,var(--ember)) 22%,transparent),transparent 70%),linear-gradient(180deg,var(--panel2),var(--panel));transition:transform .15s,border-color .15s}
.dcard:hover{transform:translateY(-3px);border-color:var(--gold)}
.dcard .lv{font:800 13px var(--mono);color:var(--c)}
.dcard h4{margin:4px 0 0;font:900 20px/1.2 var(--serif)}
.dcard .den{font:600 11px var(--disp);letter-spacing:.12em;color:var(--muted)}
.dcard .meta{display:flex;gap:10px;margin-top:10px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin-bottom:18px}
.box{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:12px 14px;font-size:13.5px;color:var(--ink2);min-width:0}
.box h5{margin:0 0 6px;font:700 12px var(--sans);letter-spacing:.1em;color:var(--gold)}
.box ul{margin:0;padding-left:18px}
.qcard{border-left:3px solid var(--cc,var(--line2))}
.qcard h4{margin:0;font:800 17px/1.3 var(--serif);color:var(--ink);padding-right:30px}
.qcard .qen{font:500 12px var(--disp);color:var(--muted);letter-spacing:.06em}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;font-size:13px;margin-top:10px}
.kv dt{color:var(--muted);white-space:nowrap}
.kv dd{margin:0;color:var(--ink2)}
.kv dd.rw{color:var(--green)}
.tip{margin-top:8px;font-size:13px;padding:7px 10px;border-radius:10px;background:color-mix(in srgb,var(--gold) 10%,transparent);color:var(--ink2)}
.tip::before{content:"提示　";font-weight:800;color:var(--gold)}
footer{margin-top:50px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}

@media (max-width:640px){
  .hero{padding:24px 18px 20px;border-radius:18px}
  .rail{grid-template-columns:repeat(3,minmax(0,1fr))}
  .rrow,.rticks{grid-template-columns:78px minmax(0,1fr)}
  .rname{font-size:12px}
  .toolbar{top:0;position:relative}
  .topbar{position:relative}
  .brand small{display:none}
  .picker label{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.card.craft{border-style:dashed;border-color:color-mix(in srgb,var(--q2) 50%,var(--line));background:radial-gradient(260px 120px at 100% 0,color-mix(in srgb,var(--q2) 13%,transparent),transparent 70%),linear-gradient(180deg,var(--panel2),var(--panel))}
.tag.craft{border-color:var(--q2);color:var(--q2)}
.verdict.bonus.craft{border-color:color-mix(in srgb,var(--q2) 55%,transparent)}
.verdict.bonus.craft{background:color-mix(in srgb,var(--q2) 11%,transparent)}
.verdict.bonus.craft::before{content:"🧵 "}

.hero{padding:24px 26px 20px}
.hero h1{font-size:clamp(28px,4.6vw,44px)}
.builds{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.bchip{border:1px solid var(--line2);background:var(--panel);padding:7px 14px;border-radius:12px;cursor:pointer;text-align:left;min-width:0}
.bchip b{display:block;font-size:14px;color:var(--ink)}
.bchip span{font-size:11.5px;color:var(--muted)}
.bchip[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;background:var(--panel2)}
.bgrp{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;width:100%}
.bspec{flex:0 0 72px;font:800 14px var(--serif);color:var(--gold2);display:flex;align-items:center}
.bdesc .src{margin-top:6px;font-size:12px;color:var(--muted)}
@media (max-width:640px){.bspec{flex-basis:100%}}
.bchip.lv b::before{content:"練級 ";color:var(--green);font-size:12px}
.bchip.end b::before{content:"滿級 ";color:var(--ember);font-size:12px}
.bdesc{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:12px 14px;margin-bottom:12px;font-size:14px;color:var(--ink2)}
.bdesc h3{margin:0 0 4px;font:800 17px var(--serif);color:var(--gold2)}
.lvctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.lvctl input[type=range]{flex:1 1 200px;accent-color:var(--gold)}
.lvctl b{font:800 18px var(--mono);color:var(--gold2);min-width:58px}
.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:13px;color:var(--ink)}
.btn:hover{border-color:var(--gold)}
.sumbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:57px;z-index:15;padding:8px 0;background:linear-gradient(var(--bg) 75%,transparent)}
.sumbar .pts{font:800 15px var(--mono);color:var(--gold2);padding:6px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--panel)}
.sumbar .pts small{font:500 12px var(--sans);color:var(--muted);margin-left:6px}
.treetabs{display:none;gap:6px;margin:6px 0}
.treetabs button{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 4px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink2)}
.treetabs button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold2);background:var(--panel2)}
.trees{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tree{border:1px solid var(--line2);border-radius:16px;padding:10px 10px 12px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,color-mix(in srgb,var(--panel2) 85%,transparent),color-mix(in srgb,var(--panel) 92%,transparent)),var(--tbg) center/cover no-repeat;min-width:0}
.tree h3{margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;font:800 17px var(--serif);color:var(--gold2)}
.tree h3 small{font:700 13px var(--mono);color:var(--ink2)}
.tree h3 button{font-size:11px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:1px 7px;cursor:pointer;color:var(--muted)}
.grid7{position:relative;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(7,auto);gap:12px 0;justify-items:center}
.tal{position:relative;width:46px;height:46px;border-radius:9px;border:2px solid #555;background:#111;cursor:pointer;padding:0;z-index:2;touch-action:manipulation;-webkit-touch-callout:none;user-select:none}
.tal img{width:100%;height:100%;border-radius:7px;display:block;filter:grayscale(1) brightness(.55)}
.tal.avail{border-color:#2fbf4a}
.tal.avail img{filter:none}
.tal.some{border-color:#2fbf4a}
.tal.some img,.tal.max img{filter:none}
.tal.max{border-color:var(--gold)}
.tal .rk{position:absolute;right:-7px;bottom:-7px;font:700 11px/1 var(--mono);background:#0b0907;color:#9be29c;border:1px solid #2fbf4a;border-radius:6px;padding:2px 4px}
.tal.max .rk{color:var(--gold2);border-color:var(--gold)}
.tal:not(.avail):not(.some):not(.max) .rk{color:#888;border-color:#555}
.tal .fb{position:absolute;inset:0;display:grid;place-items:center;font:900 15px var(--serif);color:#aaa}
.tal img + .fb{display:none}
.tal.sel{outline:2px solid var(--gold2);outline-offset:2px}
.arrow{position:absolute;background:#555;z-index:1;pointer-events:none}
.arrow.on{background:#2fbf4a}
.tip{position:fixed;z-index:60;max-width:320px;background:#0d0a07f2;color:#eee3cf;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.55;pointer-events:none;box-shadow:0 12px 30px -10px #000}
.tip::before{content:none}
.tip b{font-size:15px;color:#f4d48f}
.tip .rkl{color:#9be29c;font:700 12px var(--mono)}
.tip .nx{color:#aaa;margin-top:6px}
.tip .nx em{color:#f4d48f;font-style:normal}
.tip .meta{color:#8f7d66;font-size:12px}
.tip .warn{color:#ff8a6b;font-size:12px;margin-top:4px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--panel2);border-top:1px solid var(--line2);border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -14px 40px -12px #000;transform:translateY(105%);transition:transform .2s}
.sheet.open{transform:none}
.sheet .bar{width:44px;height:4px;border-radius:4px;background:var(--line2);margin:-4px auto 10px}
.sheet h4{margin:0;font:800 18px var(--serif);color:var(--gold2)}
.sheet .rkl{font:700 13px var(--mono);color:var(--green)}
.sheet p{margin:6px 0;font-size:14px;color:var(--ink2)}
.sheet .row{display:flex;gap:10px;margin-top:10px}
.sheet .row .btn{flex:1;font-size:16px;padding:10px}
.order{margin-top:12px}
.order table{width:100%;border-collapse:collapse;font-size:13px}
.order td{padding:4px 6px;border-bottom:1px dashed var(--line)}
.order td:first-child{font:700 12px var(--mono);color:var(--muted);width:54px}
.order tr.future td{opacity:.45}
.order .tn{color:var(--muted);font-size:12px}
footer{font-size:12.5px}
@media (max-width:760px){
  .treetabs{display:flex}
  .trees{grid-template-columns:minmax(0,1fr)}
  .tree{display:none}
  .tree.show{display:block}
  .sumbar{top:0;position:sticky}
}
@media (max-width:640px){ .hero{padding:20px 16px 16px} .tal{width:48px;height:48px} }
</style>

wless Execution",1],["Aggression",2],["Blade Flurry",1],["Aggression",1],["Hack and Slash",1],["Dual Wield Specialization",2],["Flash of Steel",4],["Malice",5],["Improved Slice and Dice",3],["Improved Expose Armor",2],["Ruthlessness",3],["Lethality",2],["Vile Poisons",3],["Cold Blood",1],["Vile Poisons",1],["Venom",1],["Flash of Steel",1]]},{"kind":"endgame","spec":"刺殺","name":"刺殺截肢團隊","desc":"雙匕首截肢＋毒藥的60級刺殺配置（35/11/5）。指南頁的60級刺殺計算器連結與說明仍是舊版天賦（提到已移除的Murder、致命偷襲5/5），無法直接使用，因此本配置依指南列出的關鍵天賦自行整理：惡意、無情、強化切割、致命偷襲、強化毒藥、惡性毒藥5/5、毒液、無情打擊、封印命運與40級截肢，戰鬥取憐憫之擊、迅捷打擊、精確與刺傷（提高截肢致命一擊，搭配封印命運），敏銳取伺機而動5/5。強化破甲2/2是指南特別推薦的團隊工具，刺殺拿它的代價最小。循環：截肢集點、戳刺維持毒液、切割與破甲常駐、剔骨收尾。","source":"https://www.warcrafttavern.com/forever/guides/assassination-rogue/","order":[["Malice",5],["Ruthlessness",3],["Improved Slice and Dice",3],["Lethality",2],["Improved Expose Armor",2],["Improved Poisons",5],["Venom",1],["Vile Poisons",4],["Seal Fate",3],["Relentless Strikes",2],["Mutilate",1],["Relentless Strikes",3],["Vile Poisons",1],["Coup de Grace",3],["Efficient Strikes",2],["Precision",3],["Puncturing Wounds",3],["Opportunity",5]]},{"kind":"endgame","spec":"敏銳","name":"敏銳伏擊團隊","desc":"Warcraft Tavern敏銳指南的60級伏擊版（11/8/32）。關鍵是27級鬼魅攻擊，讓你在戰鬥中也能施放伏擊；伺機而動、強化伏擊與先發制人強化伏擊並多給連擊點，出血是日常集點技能，靴中劍讓戳刺加連擊點，40級死亡印記負責爆發，伺機待發可多一次消失＋伏擊。另取憐憫之擊（同時強化死亡印記）、迅捷打擊、精確與強化破甲；指南說精確在命中足夠後可換成無情。伏擊版不受流血免疫首領影響。","source":"https://www.warcrafttavern.com/forever/guides/subtlety-rogue/","order":[["Opportunity",5],["Camouflage",3],["Improved Ambush",3],["Master of Deception",3],["Initiative",3],["Ghostly Strike",1],["Serrated Blades",3],["Hemorrhage",1],["Preparation",1],["Elusiveness",2],["Boot Knife",5],["Death Mark",1],["Premeditation",1],["Coup de Grace",3],["Efficient Strikes",2],["Precision",3],["Malice",5],["Improved Slice and Dice",3],["Improved Expose Armor",2],["Lethality",1]]},{"kind":"endgame","spec":"敏銳","name":"敏銳流血團隊","desc":"Warcraft Tavern敏銳指南的60級流血版（14/6/31）。伺機而動與陰險動作強化絞喉，先發制人在絞喉後多給連擊點，鋸刃提高割裂30%並無視9%護甲，出血再讓割裂與絞喉傷害提高，鬼魅攻擊用來在戰鬥中重新補上絞喉；40 ge",2],["Elemental Weapons",3],["Shamanistic Focus",1],["Ancestral Knowledge",1],["Stormstrike",1],["Flurry",5],["Improved Stormstrike",2],["Mental Quickness",2],["Maelstrom Weapon",5],["Rage of the Farseer",1],["Improved Ghost Wolf",2],["Ancestral Knowledge",2],["Tidal Focus",5],["Mindfulness",3],["Concussion",5],["Elemental Devastation",3]]},{"kind":"leveling","spec":"元素戰鬥","name":"元素練級","desc":"10～35級照Warcraft Tavern練級指南的中期元素天賦：震盪、元素矯捷、烈焰召喚、20級元素集中（節能施法）、傳導、火的試煉（火焰新星與熔岩圖騰）、暴風之眼、30級雷霆召喚、31～33級閃電超載、元素延伸與35級元素之怒。指南循環是以熔岩爆裂開怪、在飛行途中接烈焰震擊，冷卻好就放熔岩爆裂，閃電箭填空；並提醒元素練級主要問題是耗魔與觸發不穩。35級後為我的延伸：補滿元素之怒、40級閃電精通，41級起恢復系潮汐集中、正念、圖騰集中與51級水之盾改善續航，最後增強系雷鳴猛擊與先祖知識，與總覽頁建議的31/9/11一致。","source":"https://www.warcrafttavern.com/forever/guides/shaman-leveling/","order":[["Concussion",5],["Elemental Alacrity",3],["Call of Flame",2],["Elemental Focus",1],["Call of Flame",1],["Convection",3],["Trial by Fire",2],["Eye of the Storm",3],["Call of Thunder",1],["Lightning Overload",3],["Elemental Reach",1],["Elemental Fury",5],["Lightning Mastery",1],["Tidal Focus",5],["Mindfulness",3],["Totemic Focus",2],["Water Shield",1],["Thundering Strikes",5],["Ancestral Knowledge",4]]},{"kind":"endgame","spec":"元素戰鬥","name":"元素團隊輸出","desc":"依Warcraft Tavern薩滿總覽建議的31/9/11元素配置：總覽指出元素必須拿恢復系正念與水之盾解決耗魔，再用增強系雷鳴猛擊與先祖知識補爆擊與智力。元素31點以指南中期天賦為骨架，團隊版把火的試煉換成傳導5/5（單體戰耗魔更低，這是我的判斷），保留暴風之眼防打斷、閃電超載、元素之怒與40級閃電精通（15秒內閃電箭加速、閃電鏈無冷卻）。恢復系另取自然之擁2點降低威脅值。單體循環：烈焰震擊常駐、熔岩爆裂冷卻好就放、閃電箭填空。","source":"https://www.warcrafttavern.com/forever/guides/shaman/","order":[["Concussion",5],["Elemental Alacrity",3],["Call of Flame",2],["Elemental Focus",1],["Call of Flame",1],["Convection",5],["Eye of the Storm",3],["Call of Thunder",1],["Lightning Overload",3],["Elemental Reach",1],["Elemental Fury",5],["Lightning Mastery",1],["Tidal Focus",5],["Mindfulness",3],["Natural Grace",2],["Water Shield",1],["Thundering Strikes",5],["Ancestral Knowledge",4]]},{"kind":"endgame","spec":"恢復","name":"恢復治療","desc":"依Warcraft Tavern薩滿總覽的0/10/41恢復配置，恢復系前26點照指南中期恢復天賦：強化治療波、正念、潮汐集中、20級水之盾、先祖治療、25級法力之潮圖騰、潮汐專精、30級自然迅捷與恢復圖騰；之後補治療之路、淨化，40級激流（Forever新增，HoT並讓直接對該目標施放的治療鍊效果提高25%），最後專注治療防打斷（後段取捨為我的判斷）。增強系雷鳴猛擊與先祖知識補爆擊與智力。指南不建議以恢復單刷練級，建議用增強練級並在40級雙天賦時備用治療。","source":"https://www.warcrafttavern.com/forever/guides/shaman/","order":[["Improved Healing Wave",5],["Mindfulness",3],["Tidal Focus",2],["Water Shield",1],["Ancestral Healing",3],["Tidal Focus",1],["Mana Tide Totem",1],["Tidal Mastery",4],["Nature's Swiftness",1],["Tidal Mastery",1],["Restorative Totems",4],["Healing Way",3],["Purification",1],["Riptide",1],["Purification",4],["Restorative Totems",1],["Tidal Focus",2],["Healing Focus",3],["Thundering Strikes",5],["Ancestral Knowledge",5]]}],"mage":[{"kind":"leveling","spec":"冰霜","name":"冰法練級（冰霜長矛）","desc":"Warcraft Tavern 認為冰霜仍是 Forever 法師最快、最穩的練級天賦，關鍵是新增的冰霜長矛與冰霜之指（冰霜長矛因太強已被加上8秒冷卻）。依指南先在秘法放7點（10–14級強化引導、15–16級飛彈彈幕），前期用1級寒冰箭「釣」免費秘法飛彈以減少喝水；17–21級強化寒冰箭、24–26級霜寒刺骨、27級冰霜長矛、28–36級寒冰裂片與碎冰（32級寒冰屏障），37–38級冰霜之指讓未凍結的目標也能吃到碎冰爆擊，42–46級深冬之寒強化冰錐術、47級寒冰護體，最後補秘法專注與焚化。循環：寒冰箭為主，霜寒刺骨或冰霜之指觸發就接冰霜長矛，沒觸發時冰霜新星＋冰霜長矛；指南提到 Forever 的暴風雪／烈焰風暴／魔爆術 AoE 刷怪已被調弱，AoE 只在組隊或冰霜新星後使用，所以本配點不點強化暴風雪。60級可直接轉成下方的冰法團隊配點。","source":"https://www.warcrafttavern.com/forever/guides/mage-leveling/","order":[["Improved Channeling",5],["Missile Barrage",2],["Improved Frostbolt",5],["Precision",2],["Frostbite",3],["Ice Lance",1],["Ice Shards",4],["Ice Block",1],["Shatter",3],["Ice Shards",1],["Fingers of Frost",2],["Cold Snap",1],["Improved Cone of Cold",2],["Winter's Chill",5],["Ice Barrier",1],["Precision",1],["Arcane Concentration",5],["Improved Cone of Cold",1],["Incineration",5],["Arcane Impact",1]]},{"kind":"leveling","spec":"秘法","name":"秘法練級（秘法衝擊）","desc":"Warcraft Tavern 表示 Forever 的秘法可以單刷野外練級，但比冰法更依賴節能施法與飛彈彈幕的觸發運氣、法力管理和裝備，在副本中會比野外輕鬆。10–14級強化引導、15–16級盡快拿飛彈彈幕（此時用1級寒冰箭釣免費秘法飛彈），17–22級秘法專注，20級取得秘法衝擊、25級秘法懲戒（傷害隨法力上限成長的新法術），26–28級秘法冥想（施法時保留50%法力回復），之後依序拿氣定神閒（33級）、秘法心智（34–38級）、秘法增效與43級秘法強化。45級後轉火焰點焚化、劇烈燃油、強化火焰衝擊與點燃，在4層秘法衝擊時用火焰衝擊補傷害。循環：秘法衝擊疊層→飛彈彈幕觸發就放秘法飛彈→3–4層時秘法懲戒，注意前期連放3發秘法衝擊就可能沒魔；60級後可重點火焰部分改成秘法團隊配點（炎爆術＋升溫）。","source":"https://www.warcrafttavern.com/forever/guides/mage-leveling/","order":[["Improved Channeling",5],["Missile Barrage",2],["Arcane Concentration",3],["Arcane Blast",1],["Arcane Concentration",2],["Arcane Impact",2],["Arcane Wrath",1],["Arcane Meditation",3],["Precision",3],["Arcane Impact",1],["Presence of Mind",1],["Arcane Mind",5],["Arcane Instability",3],["Arcane Subtlety",1],["Arcane Power",1],["Arcane Subtlety",1],["Incineration",5],["Accelerant",5],["Improved Fire Blast",1],["Ignite",5]]},{"kind":"leveling","spec":"火焰","name":"火法練級（升溫炎爆）","desc":"Warcraft Tavern 的火法練級配點：10–12級先拿 精確（法術命中+6%），13–22級劇烈燃油（火球術施法-0.5秒）與點燃，23級炎爆術、24–26級燃燒之魂（防推遲、降仇恨），28級升溫（火球術等直接傷害爆擊後縮短下一發炎爆術施法時間，最多3層）。27–44級補焚化、火焰重擊、強化火焰衝擊、火焰強化、強化灼燒與43級燃燒，45級起轉秘法：強化引導、50–51級飛彈彈幕、秘法專注，57–59級元素大師回魔。指南提醒火法練級的最大問題是太依賴爆擊率，中低等級常疊不滿3層升溫，要到高等級和好裝備才順；若前期打怪吃力，可把頭7點先放秘法（強化引導5＋飛彈彈幕2）提早拿到飛彈彈幕。火法耗魔是三系最低，但整體練級速度不如冰法。","source":"https://www.warcrafttavern.com/forever/guides/mage-leveling/","order":[["Precision",3],["Accelerant",5],["Ignite",5],["Pyroblast",1],["Burning Soul",3],["Incineration",1],["Heating Up",1],["Incineration",4],["Critical Mass",3],["Improved Fire Blast",2],["Fire Power",3],["Improved Scorch",2],["Combustion",1],["Improved Scorch",1],["Improved Channeling",5],["Missile Barrage",2],["Arcane Concentration",5],["Master of Elements",3],["Arcane Subtlety",1]]},{"kind":"endgame","spec":"冰霜","name":"冰法團隊（冰霜／秘法）","desc":"Warcraft Tavern 的60級冰霜／秘法配點（秘法18／火焰2／冰霜31），追求長戰鬥的輸出與續航。冰霜拿到冰霜之指2點以穩定觸發碎冰爆擊（不再只靠霜寒刺骨或冰霜新星），冰霜導能降耗魔與仇恨，極寒延伸增加射程，急速冷卻多一次寒冰屏障，深冬之寒只放1點（不刻意打冰錐術），終點寒冰護體同時提高冰霜傷害。秘法點強化引導、飛彈彈幕、秘法專注、秘法碰撞到秘法冥想（施法時保留50%法力回復），火焰2點焚化提高冰霜長矛爆擊率。循環：保持寒冰護體，寒冰箭為主、冰霜之指觸發就冰霜長矛、飛彈彈幕觸發就秘法飛彈。","source":"https://www.warcrafttavern.com/forever/guides/frost-mage/","order":[["Precision",3],["Improved Frostbolt",5],["Frostbite",3],["Ice Shards",5],["Ice Lance",1],["Ice Block",1],["Shatter",3],["Cold Snap",1],["Fingers of Frost",2],["Frost Channeling",3],["Arctic Reach",2],["Winter's Chill",1],["Ice Barrier",1],["Improved Channeling",5],["Missile Barrage",2],["Arcane Concentration",5],["Arcane Impact",3],["Arcane Meditation",3],["Incineration",2]]},{"kind":"endgame","spec":"冰霜","name":"冰錐術深冬之寒","desc":"Warcraft Tavern 的另一種60級冰法（秘法18／冰霜33）：強調 Forever 重做的深冬之寒——寒冰箭與冰霜之指強化冰霜長矛時堆疊深冬之寒，讓下一發冰錐術傷害提高，再配強化冰錐術3點。這是較近距離的打法，冰錐術冷卻好就用，因此不點極寒延伸與焚化，其餘與冰霜／秘法配點相同，一樣點到秘法冥想維持法力。適合不怕站近、想要更高爆發的冰法；需要遠距離安全輸出時改用冰法團隊配點。","source":"https://www.warcrafttavern.com/forever/guides/frost-mage/","order":[["Improved Frostbolt",5],["Precision",3],["Ice Shards",5],["Ice Lance",1],["Frost Channeling",3],["Shatter",3],["Ice Block",1],["Fingers of Frost",2],["Cold Snap",1],["Improved Cone of Cold",3],["Winter's Chill",4],["Ice Barrier",1],["Improved Channeling",5],["Missile Barrage",2],["Arcane Concentration",5],["Arcane Impact",1],["Winter's Chill",1],["Arcane Impact",2],["Arcane Meditation",3]]},{"kind":"endgame","spec":"秘法","name":"秘法團隊（秘法衝擊＋炎爆）","desc":"Warcraft Tavern 的60級秘法副本／團隊配點（秘法31／火焰17／冰霜3）。指南指出秘法很難靠其他系大幅強化，所以主修秘法到秘法強化（強化引導、飛彈彈幕、秘法專注、秘法衝擊、秘法懲戒、秘法冥想、秘法碰撞、秘法心智、秘法增效、氣定神閒），再深入火焰拿焚化（秘法衝擊爆擊率）、劇烈燃油（秘法懲戒施法加快）、點燃、炎爆術與升溫，冰霜3點 精確 補命中。循環：秘法衝擊疊層並用節能施法觸發施放，飛彈彈幕觸發放秘法飛彈，3–4層時秘法懲戒；在1–2層與4層時用火焰衝擊（或灼燒）觸發點燃與升溫，3層升溫時打快速炎爆術；秘法強化與氣定神閒留在4層秘法衝擊時爆發。秘法極吃法力，精神與法力回復很重要（點數順序已依天賦層數規則微調一點）。","source":"https://www.warcrafttavern.com/forever/guides/arcane-mage/","order":[["Improved Channeling",5],["Missile Barrage",2],["Arcane Concentration",5],["Arcane Blast",1],["Arcane Subtlety",1],["Arcane Impact",1],["Arcane Wrath",1],["Arcane Meditation",3],["Arcane Impact",2],["Presence of Mind",1],["Arcane Mind",5],["Arcane Instability",3],["Arcane Power",1],["Precision",3],["Accelerant",5],["Incineration",2],["Ignite",5],["Pyroblast",1],["Incineration",2],["Heating Up",1],["Incineration",1]]},{"kind":"endgame","spec":"火焰","name":"火法團隊（升溫炎爆）","desc":"Warcraft Tavern 的60級火法配點（秘法18／火焰31／冰霜2），目標是最大化火焰傷害並節省法力。火焰走焚化、劇烈燃油、點燃、炎爆術、燃燒之魂、升溫、火焰重擊、強化灼燒、火焰強化到燃燒，元素大師1點；秘法拿強化引導、秘法專注、秘法碰撞、飛彈彈幕與秘法冥想3點，冰霜 精確 只放2點以換取完整的秘法冥想（指南也提供 精確 3／秘法冥想2的版本）。循環：首領戰預讀炎爆術，灼燒疊滿5層強化灼燒，火焰衝擊冷卻好就用，火球術為填充，3層升溫時施放炎爆術，燃燒用於爆發，飛彈彈幕觸發時放秘法飛彈（元素大師1點已移到燃燒之前，以符合層數規則）。","source":"https://www.warcrafttavern.com/forever/guides/fire-mage/","order":[["Incineration",5],["Accelerant",5],["Ignite",5],["Pyroblast",1],["Burning Soul",3],["Heating Up",1],["Critical Mass",3],["Improved Scorch",3],["Fire Power",3],["Master of Elements",1],["Combustion",1],["Precision",2],["Improved Channeling",5],["Arcane Concentration",5],["Arcane Impact",3],["Missile Barrage",2],["Arcane Meditation",3]]},{"kind":"endgame","spec":"火焰","name":"霜火箭元素法","desc":"Warcraft Tavern 的60級霜火箭配點（火焰29／冰霜22），屬於 Forever 新增的「元素法」玩法：以40級學到的霜火箭為主力，劇烈燃油縮短霜火箭施法，寒冰裂片強化其爆擊傷害。冰霜點 精確、冰霜護罩、寒冰裂片、冰霜長矛、冰霜導能、霜寒刺骨、寒冰屏障、碎冰到冰霜之指——霜火箭的冰冷效果能穩定觸發冰霜之指，使目標視同凍結，配合碎冰連續爆擊，帶出大量點燃傷害並觸發升溫。為了省點數，這版不點燃燒之魂而取強化火焰衝擊與元素大師1點；指南建議單刷時把這些點數換回燃燒之魂。","source":"https://www.warcrafttavern.com/forever/guides/fire-mage/","order":[["Incineration",5],["Accelerant",5],["Ignite",5],["Pyroblast",1],["Heating Up",1],["Improved Fire Blast",2],["Improved Scorch",3],["Critical Mass",3],["Fire Power",3],["Precision",3],["Frost Warding",2],["Ice Shards",5],["Ice Lance",1],["Frost Channeling",3],["Frostbite",1],["Ice Block",1],["Shatter",3],["Frostbite",1],["Fingers of Frost",2],["Master of Elements",1]]}],"warlock":[{"kind":"leveling","spec":"痛苦","name":"痛苦練級（吸取坦怪）","desc":"Warcraft Tavern 推薦的術士練級天賦，全程不必重置（痛苦41／惡魔學識7／毀滅3）：DoT 打完靠魔杖收尾到29級，30級起改用吸取生命當填充、靠吸取補回生命分流扣的血，20級前虛空行者坦、之後換魅魔。10–14級強化腐蝕術（瞬發腐蝕術）、15–17級鎮壓，18–24級邪惡強化與惡魔能量（惡魔學識，強化寵物），25–30級強化吸取、詛咒增幅、強化痛苦災厄，31–40級補滿鎮壓、災疫、37級生命虹吸（指南刻意延後，因為1級時太弱）與靈魂虹吸，42–46級暗影專精，47級毀壞，之後惡意、惡魔專注、夜幕與強化暗影箭。進階玩法是一次拉2隻：第一隻上 DoT 後恐懼，第二隻交給寵物；想更早拿毀壞，指南建議40級重置成31點全痛苦再補回寵物天賦。","source":"https://www.warcrafttavern.com/forever/guides/warlock-leveling/","order":[["Improved Corruption",5],["Suppression",3],["Unholy Power",5],["Demonic Energies",2],["Improved Drains",3],["Amplify Curse",1],["Improved Bane of Agony",2],["Suppression",2],["Pandemic",3],["Improved Life Tap",1],["Siphon Life",1],["Soul Siphon",3],["Improved Life Tap",1],["Shadow Mastery",5],["Wrack",1],["Malevolence",5],["Fel Concentration",3],["Nightfall",2],["Improved Shadow Bolt",3]]},{"kind":"leveling","spec":"惡魔學識","name":"惡魔學識練級（魅魔坦怪）","desc":"依 Warcraft Tavern 的「不重置」惡魔學識路線（惡魔學識31／痛苦20）：核心是 Forever 新天賦惡魔烙印（25–27級）——灼熱之痛會烙印目標，讓魅魔接下來的攻擊額外造成傷害與仇恨，魅魔可同時穩住2–3隻怪。10–24級先點邪惡強化、惡魔能量、惡魔活力、強化薩亞德與召喚大師湊滿15點；28–40級惡魔犧牲、靈魂鏈結（30級，傷害30%轉給寵物）、惡魔知識、惡魔支配、惡魔學識大師，40級惡魔契印（犧牲小鬼得暗影增傷後再召魅魔也不會取消）。41–60級回痛苦補強化腐蝕術、強化生命分流、鎮壓、強化吸取、災疫與惡意。指南的首選其實是先照痛苦練級配點到27級再重置成惡魔學識（27級剛好夠點滿惡魔烙印），本配點則是不想重置的版本，前期因沒有瞬發腐蝕術會稍慢；拿到惡魔烙印前別放灼熱之痛，以免搶仇恨。","source":"https://www.warcrafttavern.com/forever/guides/warlock-leveling/","order":[["Unholy Power",5],["Demonic Energies",2],["Fel Vitality",3],["Improved Sayaad",3],["Master Summoner",2],["Demonic Brand",3],["Demonic Sacrifice",1],["Demonic Embrace",1],["Soul Link",1],["Demonic Knowledge",3],["Fel Domination",1],["Master Demonologist",5],["Demonic Pact",1],["Improved Corruption",5],["Improved Life Tap",2],["Suppression",5],["Improved Drains",3],["Pandemic",3],["Malevolence",2]]},{"kind":"leveling","spec":"毀滅","name":"毀滅練級（焚燒爆發）","desc":"Warcraft Tavern 的毀滅練級配點（毀滅31／痛苦17／惡魔學識3），不需重置，40級前全點毀滅，玩起來就像60級的毀滅循環。10–20級災禍、災變、清算2點與20級暗影灼燒，21–25級補滿清算、毀滅1點、25級焚燒，26–30級毀滅與苦惱之焰，31–40級浩劫之禍、硫磺與火焰、暗影與火焰，40級燒盡取代暗影箭當填充；41–60級回痛苦補鎮壓、強化生命分流、強化腐蝕術、詛咒增幅、災疫、惡意，以及強化小鬼。指南評價：毀滅是三系中續航最差的練級天賦（硬讀條多、耗魔高、自補少），常需要停下來喝水，但在副本裡很強；若野外法力吃緊，可先點鎮壓與強化生命分流再點硫磺與火焰。","source":"https://www.warcrafttavern.com/forever/guides/warlock-leveling/","order":[["Bane",5],["Cataclysm",3],["Aftermath",2],["Shadowburn",1],["Aftermath",3],["Ruin",1],["Conflagrate",1],["Ruin",2],["Agonizing Flames",3],["Bane of Havoc",1],["Fire and Brimstone",3],["Shadow and Flame",5],["Incinerate",1],["Suppression",5],["Improved Life Tap",2],["Improved Corruption",5],["Improved Imp",3],["Amplify Curse",1],["Pandemic",3],["Malevolence",1]]},{"kind":"endgame","spec":"痛苦","name":"痛苦毀壞團隊","desc":"Warcraft Tavern 的60級痛苦團隊首選「毀壞」配點（痛苦35／惡魔學識11／毀滅5）。以 Forever 新終極天賦毀壞為填充：引導期間目標身上的腐蝕術、生命虹吸與痛苦災厄跳傷速度加倍，靈魂虹吸再依 DoT 數量增加毀壞傷害；惡魔犧牲犧牲小鬼取得暗影增傷，之後不帶寵物作戰，暗影箭只在夜幕觸發瞬發時使用。鎮壓5點提供命中（指南：首領需要17%命中）並降低仇恨，災疫讓 DoT 與吸取爆擊加倍，詛咒增幅冷卻好就用在痛苦災厄上，毀滅5點強化暗影箭使暗影傷害提高。由於毀壞需要站樁引導，副本建議改用下方的暗影專精／毀滅配點。","source":"https://www.warcrafttavern.com/forever/guides/affliction-warlock/","order":[["Suppression",5],["Improved Corruption",5],["Improved Life Tap",2],["Improved Bane of Agony",2],["Amplify Curse",1],["Pandemic",3],["Malevolence",5],["Nightfall",2],["Siphon Life",1],["Soul Siphon",3],["Shadow Mastery",5],["Wrack",1],["Demonic Embrace",5],["Demonic Aegis",2],["Fel Vitality",3],["Demonic Sacrifice",1],["Improved Shadow Bolt",5]]},{"kind":"endgame","spec":"痛苦","name":"痛苦暗毀（SM Ruin）","desc":"Warcraft Tavern 的另一個60級痛苦配點「暗影專精／毀滅」（痛苦30／毀滅21）：保留暗影箭為填充並帶魅魔，傷害略低於毀壞配點，但適合喜歡硬讀條、想帶寵物或需要移動的場合，指南也建議副本用這一套。痛苦取鎮壓、強化腐蝕術、強化生命分流、災疫、惡意、夜幕、生命虹吸與暗影專精；毀滅取強化暗影箭（暗影箭爆擊後目標受到的暗影傷害提高20%）、災禍（縮短暗影箭與獻祭施法）、災變、毀滅與苦惱之焰。指南提到副本中可把第3點災變移到暗影灼燒，用來收掉逃跑的怪。","source":"https://www.warcrafttavern.com/forever/guides/affliction-warlock/","order":[["Suppression",5],["Improved Corruption",5],["Improved Life Tap",2],["Improved Bane of Agony",1],["Amplify Curse",1],["Pandemic",3],["Malevolence",5],["Nightfall",2],["Siphon Life",1],["Shadow Mastery",5],["Improved Shadow Bolt",5],["Bane",5],["Cataclysm",3],["Ruin",5],["Agonizing Flames",3]]},{"kind":"endgame","spec":"惡魔學識","name":"惡魔火焰團隊（犧牲魅魔）","desc":"Warcraft Tavern 的60級惡魔學識「火焰」配點（痛苦2／惡魔學識31／毀滅18）：用惡魔犧牲犧牲魅魔（火焰傷害+15%），再靠惡魔契印讓召喚小鬼後效果不會消失，灼熱之痛為填充、靈魂之火為斬殺（屠虐在目標35%以下讓靈魂之火加快且不耗靈魂裂片）。惡魔烙印讓灼熱之痛烙印目標、強化寵物後續攻擊，惡魔知識在寵物存在時提高你與寵物的法術傷害，強化小鬼與惡魔能量（指南：生命分流的法力會傳給寵物）讓小鬼長時間輸出；毀滅取災禍、清算、毀滅與苦惱之焰。指南認為戰鬥超過1分鐘時火焰版較強，副本也推薦此版（地獄烈焰、火焰之雨吃得到加成）；身上暗影傷害裝較多時改用暗影版。","source":"https://www.warcrafttavern.com/forever/guides/demonology-warlock/","order":[["Suppression",1],["Improved Corruption",1],["Improved Imp",3],["Unholy Power",5],["Fel Vitality",3],["Demonic Energies",2],["Demonic Sacrifice",1],["Master Summoner",2],["Decimation",2],["Demonic Brand",3],["Demonic Knowledge",3],["Soul Link",1],["Master Demonologist",5],["Demonic Pact",1],["Bane",5],["Aftermath",5],["Ruin",5],["Agonizing Flames",3]]},{"kind":"endgame","spec":"惡魔學識","name":"惡魔暗影團隊（犧牲小鬼）","desc":"Warcraft Tavern 的60級惡魔學識「暗影」配點（痛苦2／惡魔學識31／毀滅18）：犧牲小鬼取得暗影增傷，透過惡魔契印再召喚魅魔作戰，暗影箭為填充，灼熱之痛只用來補惡魔烙印。惡魔學識部分與火焰版相同（邪惡強化、惡魔活力、惡魔能量、惡魔犧牲、召喚大師、屠虐、惡魔烙印、惡魔知識、靈魂鏈結、惡魔學識大師、惡魔契印），但以強化薩亞德取代強化小鬼；毀滅以強化暗影箭取代清算。指南說明：裝備上暗影傷害多時選暗影版，一般法術能量或火焰傷害多則選火焰版；此版不使用靈魂之火（開怪預讀除外）。","source":"https://www.warcrafttavern.com/forever/guides/demonology-warlock/","order":[["Suppression",1],["Improved Corruption",1],["Unholy Power",5],["Fel Vitality",3],["Demonic Energies",2],["Improved Sayaad",3],["Demonic Sacrifice",1],["Master Summoner",2],["Decimation",2],["Demonic Brand",3],["Demonic Knowledge",3],["Soul Link",1],["Master Demonologist",5],["Demonic Pact",1],["Improved Shadow Bolt",5],["Bane",5],["Ruin",5],["Agonizing Flames",3]]},{"kind":"endgame","spec":"毀滅","name":"毀滅魅魔團隊（燒盡）","desc":"Warcraft Tavern 認為只要寵物活著，這是最強的60級毀滅配點（痛苦14／惡魔學識4／毀滅33），帶魅魔、不犧牲。核心是 Forever 的燒盡（填充，目標有獻祭時多25%傷害）與暗影與火焰（焚燒提高暗影傷害、暗影灼燒提高火焰傷害，且焚燒不消耗獻祭），硫磺與火焰提高焚燒爆擊率，災禍、苦惱之焰、毀滅與清算強化獻祭與燒盡，災變與浩劫之禍是通往燒盡的過門（浩劫之禍在雙目標時有分攤傷害效果）。痛苦取鎮壓5點命中、強化腐蝕術3點、強化生命分流、詛咒增幅與災疫；惡魔學識4點邪惡強化。循環：災厄→詛咒→獻祭→腐蝕術→焚燒→暗影灼燒→燒盡；指南提到副本可把2點鎮壓移到強化腐蝕術，想帶小鬼（隊伍耐力）則改用強化小鬼＋惡魔能量的小鬼版。","source":"https://www.warcrafttavern.com/forever/guides/destruction-warlock/","order":[["Improved Life Tap",2],["Suppression",5],["Improved Corruption",3],["Amplify Curse",1],["Pandemic",3],["Unholy Power",4],["Bane",5],["Cataclysm",3],["Aftermath",5],["Ruin",5],["Shadowburn",1],["Agonizing Flames",3],["Conflagrate",1],["Bane of Havoc",1],["Fire and Brimstone",3],["Shadow and Flame",5],["Incinerate",1]]},{"kind":"endgame","spec":"毀滅","name":"毀滅犧牲（無寵物）","desc":"Warcraft Tavern 的毀滅「惡魔犧牲」版本（痛苦7／惡魔學識11／毀滅33）：犧牲魅魔取得火焰傷害+15%並且不帶寵物作戰，毀滅點數與循環和魅魔版完全相同。惡魔學識取惡魔之擁、惡魔庇護與惡魔活力以到達惡魔犧牲，痛苦取強化生命分流與強化腐蝕術5點。因為放棄了寵物傷害，指南表示此版輸出落後於魅魔版，適合不想照顧寵物、或寵物容易被 AoE 打死的場合；命中不足時，指南建議先從強化腐蝕術抽3點放到鎮壓。","source":"https://www.warcrafttavern.com/forever/guides/destruction-warlock/","order":[["Improved Life Tap",2],["Improved Corruptio let cls = "", T = null, ranks = {}, flat = [], byId = {}, build = null, tab = 0, selId = null, playLv = 60;

function setClass(c) {

const spentTree = (ti, R = ranks) => flat.filter(x => x.ti === ti).reduce((a, x) => a + (R[x.id] || 0), 0);

function canAdd(x, R = ranks) {
  if ((R[x.id] || 0) >= x.r) return "已經點滿";
  if (spentAll(R) >= T.max) return `只有 ${T.max} 點`;
  if (spentTree(x.ti, R) < 5 * x.t) return `需要在${T.trees[x.ti].n}投入 ${5 * x.t} 點`;
  if (x.pre && (R[x.pre] || 0) < (x.pr || byId[x.pre].r)) return `需要先點滿「${byId[x.pre].n}」`;

function canRemove(x, R = ranks) {
  const cur = R[x.id] || 0; if (!cur) return "沒有點數";
  const R2 = Object.assign({}, R, { [x.id]: cur - 1 });
  for (const y of flat) {

    if (y.pre === x.id && R2[x.id] < (y.pr || x.r)) return `「${y.n}」需要它`;
    if (y.ti === x.ti && y.t > x.t) {

function buildRanks(b, lv) {
  const R = {}; let n = 0; const limit = ptsAt(lv);
  for (const [name, k] of b.order) { const x = flat.find(z => z.en.toLowerCase() === name.toLowerCase()); if (!x) continue; for (let i = 0; i < k; i++) { if (n >= limit) return R; R[x.id] = (R[x.id] || 0) + 1; n++; } }

function arrowsFor(tr, ti) {
  let h = "";
  for (const y of tr.talents) {
    if (!y.pre) continue; const x = byId[y.pre]; if (!x) continue;
    const on = (ranks[x.id] || 0) >= (y.pr || x.r) ? " on" : "";

    ${cur ? `<div>${esc(cur)}</div>` : ""}${nx ? `<div class="nx">${r ? "下一級：" : ""}<em>${esc(nx)}</em></div>` : ""}${why && r < x.r ? `<div class="warn">${esc(why)}</div>` : ""}`;
}
function openSheet(x) {
  const sh = document.getElementById("sheet");
  sh.innerHTML = `<div class="bar"></div><h4>${esc(x.n)} <span class="rkl">${ranks[x.id] || 0}/${x.r}</span></h4><div class="meta" style="font-size:12px;color:var(--muted)">${esc(T.trees[x.ti].n)} · 第 ${x.t + 1} 層${x.a ? " · 主動技能" : ""}</div>
    <p>${esc((ranks[x.id] ? x.d[ranks[x.id] - 1] : x.d[0]) || "")}</p>${(ranks[x.id] || 0) < x.r && ranks[x.id] ? `<p style="color:var(--muted)">下一級：${esc(x.d[ranks[x.id]])}</p>` : ""}
    ${canAdd(x) && (ranks[x.id] || 0) < x.r ? `<p style="color:var(--ember);font-size:13px">${esc(canAdd(x))}</p>` : ""}
    <div class="row"><button type="button" class="btn" data-sh="-">－ 減點</button><button type="button" class="btn" data-sh="+">＋ 加點</button><button type="button" class="btn" data-sh="x">關閉</button></div>`;
  sh.classList.add("open");
}
function closeSheet() { document.getElementById("sheet").classList.remove("open"); selId = null; }
function change(x, d) {
  if (build) { build = null; }
  if (d > 0 && !canAdd(x)) ranks[x.id] = (ranks[x.id] || 0) + 1;
  if (d < 0 && !canRemove(x)) ranks[x.id] = (ranks[x.id] || 0) - 1;
  render();
}
const treesEl = document.getElementById("trees"), tip = document.getElementById("tip");
treesEl.addEventListener("click", e => {
  const rt = e.target.closest("[data-rt]"); if (rt) { const ti = +rt.dataset.rt; flat.filter(x => x.ti === ti).forEach(x => delete ranks[x.id]); build = null; render(); return; }
  const b = e.target.closest(".tal"); if (!b) return; const x = byId[b.dataset.id];
  if (mobile()) { selId = x.id; render(); return; }
  change(x, 1); showTip(b, x);
});
treesEl.addEventListener("contextmenu", e => { const b = e.target.closest(".tal"); if (!b) return; e.preventDefault(); if (mobile()) return; const x = byId[b.dataset.id]; change(x, -1); showTip(document.querySelector(`.tal[data-id="${x.id}"]`), x); });
function showTip(b, x) {
  if (mobile() || !b) return; tip.innerHTML = tipHtml(x); tip.hidden = false;
  const r = b.getBoundingClientRect(); const w = tip.offsetWidth, h = tip.offsetHeight;
  let left = r.right + 10; if (left + w > innerWidth - 8) left = r.left - w - 10; if (left < 8) left = 8;
  let top = r.top; if (top + h > innerHeight - 8) top = innerHeight - h - 8;
  tip.style.left = left + "px"; tip.style.top = Math.max(8, top) + "px";
}
treesEl.addEventListener("mouseover", e => { const b = e.target.closest(".tal"); if (!b) return; showTip(b, byId[b.dataset.id]); });
treesEl.addEventListener("mouseout", e => { if (!e.relatedTarget || !e.relatedTarget.closest || !e.relatedTarget.closest(".tal")) tip.hidden = true; });
document.getElementById("sheet").addEventListener("click", e => { const b = e.target.closest("[data-sh]"); if (!b) return; const x = byId[selId]; if (b.dataset.sh === "x") { closeSheet(); render(); return; } if (x) { const keep = selId; change(x, b.dataset.sh === "+" ? 1 : -1); selId = keep; openSheet(byId[keep]); render(); } });
document.getElementById("treetabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; tab = +b.dataset.t; render(); });
document.getElementById("builds").addEventListener("click", e => {
  const b = e.target.closest(".bchip"); if (!b) return; if (timer) { clearInterval(timer); timer = null; }
  if (!b.dataset.k) { build = null; render(); return; }
  const src = (BUILDS[cls] || [])[+b.dataset.k];
  build = Object.assign({ key: b.dataset.k }, src); playLv = 60; ranks = buildRanks(build, playLv); render();
});
let timer = null;
function setLv(v) { playLv = v; ranks = buildRanks(build, playLv); render(true); const l = document.getElementById("lvlbl"); if (l) l.textContent = "Lv " + playLv; const r = document.getElementById("lvr"); if (r && +r.value !== playLv) r.value = playLv; }
document.getElementById("bdesc").addEventListener("input", e => { if (e.target.id !== "lvr" || !build) return; setLv(+e.target.value); });
document.getElementById("bdesc").addEventListener("click", e => {
  if (e.target.id === "edit") { build = null; render(); return; }
  if (e.target.id !== "play") return;
  if (timer) { clearInterval(timer); timer = null; e.target.textContent = "▶ 播放"; return; }
  e.target.textContent = "■ 停止"; setLv(10);
  timer = setInterval(() => { if (!build || playLv >= 60) { clearInterval(timer); timer = null; const p = document.getElementById("play"); if (p) p.textContent = "▶ 播放"; return; } setLv(playLv + 1); }, 350);
});
document.getElementById("sumbar").addEventListener("click", e => {
  if (e.target.id === "reset") { ranks = {}; build = null; render(); }
  if (e.target.id === "share") { syncHash(); const u = location.href; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => { e.target.textContent = "已複製"; setTimeout(() => e.target.textContent = "複製分享連結", 1500); }).catch(() => prompt("複製這個連結：", u)); }
});
const sel = document.getElementById("pick");
sel.innerHTML = Object.entries(CLS).map(([k, c]) => `<option value="${k}">${esc(c.zh)}</option>`).join("");
function navCls(c) { document.querySelectorAll('a[href]').forEach(a => { const h = a.getAttribute("href"), b = h.split("#")[0]; if (/^(leveling|gear|talents)\.html$/.test(b)) a.setAttribute("href", b + (c ? "#" + c : "")); }); }
function fromHash() {
  const [c, a, b] = decodeURIComponent(location.hash.slice(1)).split("/");
  const mem = store.get("wowf-class", "");
  setClass(TAL[c] ? c : TAL[mem] ? mem : Object.keys(CLS)[0]); sel.value = cls; tab = 0;
  store.set("wowf-class", cls); navCls(cls);
  if (a && a[0] === "b") { const k = a.slice(1); const src = (BUILDS[cls] || [])[+k]; if (src) { build = Object.assign({ key: k }, src); playLv = Math.max(10, Math.min(60, +b || 60)); ranks = buildRanks(build, playLv); } }
  else if (a) ranks = decode(a);
  render();
}
sel.addEventListener("change", () => { location.hash = sel.value; });
addEventListener("hashchange", () => { const c = location.hash.slice(1).split("/")[0]; if (c !== cls) fromHash(); });
fromHash();
</script>
